- name: Deploy private ECR based web application to EC2
  hosts: web
  become: true

  vars:

    docker_users:
      - ubuntu
      - ssm-user

    aws_region: "ap-southeast-1"

    ecr_registry: "287347870001.dkr.ecr.ap-southeast-1.amazonaws.com"
    ecr_repository: "devops-bootcamp/final-project-hafifi"
    image_tag: "v1.0.0"

    container_name: "devops-final-project"
    container_port: 80
    host_port: 80

  roles:
    - geerlingguy.docker

  tasks:

    - name: Login to Amazon ECR
      become_user: ssm-user
      ansible.builtin.shell:
        cmd: >
          aws ecr get-login-password
          --region {{ aws_region }}
          | docker login
          --username AWS
          --password-stdin
          {{ ecr_registry }}
      no_log: true

    - name: Pull application image
      become_user: ssm-user
      community.docker.docker_image:
        name: "{{ ecr_registry }}/{{ ecr_repository }}:{{ image_tag }}"
        source: pull

    - name: Run application container
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ ecr_registry }}/{{ ecr_repository }}:{{ image_tag }}"
        state: started
        restart_policy: unless-stopped
        published_ports:
          - "{{ host_port }}:{{ container_port }}"